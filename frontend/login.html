<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FUNDROOM ERP | Wholesale Operations</title>
  <meta name="description" content="Sign in to access your Fundroom ERP wholesale operations portal dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-body">

  <div class="auth-wrapper">

    <!-- ==========================================
         LEFT COLUMN: VIDEO AREA (55%)
         ========================================== -->
    <div class="auth-video-card" id="video-card">
      <video id="auth-video" autoplay loop muted playsinline>
        <source src="assets/hero-video.mp4" type="video/mp4">
        <source src="public/videos/fundroom-login.mp4" type="video/mp4">
      </video>

      <div class="auth-video-overlay"></div>

      <!-- Video Content & Controls Overlay -->
      <div class="auth-video-content">
        <div class="video-brand-header">
          <div class="video-brand-icon">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          </div>
          <div class="video-brand-text">
            <strong>FUNDROOM ERP</strong>
            <small>WHOLESALE OPERATIONS</small>
          </div>
        </div>

        <div class="video-controls-bar">
          <button class="video-play-btn" id="video-play-toggle" aria-label="Pause or play video">
            <svg id="pause-icon" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
            <svg id="play-icon" viewBox="0 0 24 24" style="display:none;"><polygon points="5,3 19,12 5,21"/></svg>
          </button>
          <div class="video-time-display" id="video-timer">00:03 / 00:06</div>
        </div>

        <p class="video-subtitle">Your all-in-one wholesale operations platform.</p>
      </div>

      <!-- Segmented Video Progress Bar -->
      <div class="video-progress-container">
        <div class="video-progress-fill" id="video-progress-fill"></div>
      </div>
    </div>


    <!-- ==========================================
         RIGHT COLUMN: AUTHENTICATION AREA (45%)
         ========================================== -->
    <div class="auth-form-container">

      <!-- Brand Logo -->
      <div class="auth-brand-header">
        <div class="auth-brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <div class="auth-brand-text">
          <strong>FUNDROOM ERP</strong>
          <small>WHOLESALE OPERATIONS</small>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="auth-heading">
        Welcome <span class="highlight">back!</span>
      </h1>
      <p class="auth-subheading">Sign in to access your dashboard</p>

      <!-- Auth Error Alert -->
      <div class="auth-error-alert" id="login-error"></div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form">

        <!-- Email Field -->
        <div class="input-group">
          <input type="email" id="email" class="auth-input" placeholder="Email address" required autocomplete="email">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>

        <!-- Password Field -->
        <div class="input-group">
          <input type="password" id="password" class="auth-input" placeholder="Password" required autocomplete="current-password" value="admin123">
          <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Show or hide password">
            <svg id="eye-show-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-hide-icon" viewBox="0 0 24 24" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="auth-options-row">
          <label class="remember-me-label">
            <input type="checkbox" id="remember-me" checked>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Primary Sign In Button -->
        <button type="submit" class="btn-auth-primary" id="submit-btn">
          <span>Sign In</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- OR Divider -->
      <div class="auth-divider">
        <span>OR</span>
      </div>

      <!-- Google Sign In -->
      <button type="button" class="btn-google" id="google-btn">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Quick 4 Role Login Buttons -->
      <div class="role-quick-logins">
        <div class="role-quick-title">⚡ Quick Role Test Logins</div>
        <div class="role-buttons-grid">
          <button type="button" class="btn-role-quick test-login-btn" data-email="admin@company.com" data-role="Admin">
            <span>👑</span>
            <span>Admin</span>
          </button>
          <button type="button" class="btn-role-quick test-login-btn" data-email="sales@company.com" data-role="Sales">
            <span>💼</span>
            <span>Sales</span>
          </button>
          <button type="button" class="btn-role-quick test-login-btn" data-email="warehouse@company.com" data-role="Warehouse">
            <span>📦</span>
            <span>Warehouse</span>
          </button>
          <button type="button" class="btn-role-quick test-login-btn" data-email="accounts@company.com" data-role="Accounts">
            <span>📊</span>
            <span>Accounts</span>
          </button>
        </div>
      </div>

      <!-- Create Account Link -->
      <div class="auth-signup-text">
        Don't have an account? <a href="#" id="create-account-btn">Create one</a>
      </div>

    </div>

  </div>

  <!-- Floating Sound Toggle Button (Bottom Right) -->
  <button class="floating-sound-toggle" id="floating-sound-toggle" aria-label="Toggle sound">
    <svg id="sound-off-icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    <svg id="sound-on-icon" viewBox="0 0 24 24" style="display:none;"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
  </button>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
