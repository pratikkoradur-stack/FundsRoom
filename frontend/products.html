<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products & Inventory | Fundsroom Mini ERP</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div id="app-container" class="app-container">
    <!-- Sidebar rendered dynamically by layout.js -->

    <div class="main-wrapper">
      <header class="top-header">
        <div class="page-title-group">
          <h1>Product Catalog & Stock</h1>
          <p>Track wholesale inventory items, SKUs, unit prices & low stock alerts</p>
        </div>
        <div class="header-actions">
          <button id="add-product-btn" class="btn btn-primary">
            + Add New Product
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Filter & Search Bar -->
        <div class="filter-bar">
          <div class="search-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="product-search" class="form-control" placeholder="Search product name or SKU...">
          </div>

          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="low-stock-filter" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="low-stock-filter" style="font-size: 0.9rem; color: var(--warning); font-weight: 600; cursor: pointer;">⚠️ Show Only Low Stock</label>
          </div>
        </div>

        <!-- Products Table -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Product Name</th>
                  <th>SKU</th>
                  <th>Category</th>
                  <th>Unit Price</th>
                  <th>Current Stock</th>
                  <th>Warehouse Spot</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-tbody">
                <!-- Populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="product-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Product</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <form id="product-form">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="prod-name" class="form-control" required placeholder="e.g. Industrial Hydraulic Pump X1">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>SKU Code *</label>
            <input type="text" id="prod-sku" class="form-control" required placeholder="e.g. PUMP-HYD-001">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <input type="text" id="prod-category" class="form-control" required placeholder="e.g. Machinery">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Unit Price (₹) *</label>
            <input type="number" step="0.01" id="prod-price" class="form-control" required placeholder="14500.00">
          </div>
          <div class="form-group">
            <label>Initial Stock</label>
            <input type="number" id="prod-stock" class="form-control" value="0">
          </div>
          <div class="form-group">
            <label>Min Alert Qty</label>
            <input type="number" id="prod-alert" class="form-control" value="10">
          </div>
        </div>

        <div class="form-group">
          <label>Warehouse Spot / Location</label>
          <input type="text" id="prod-location" class="form-control" placeholder="e.g. Rack A1 - Shelf 2">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('product-modal').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Stock Adjustment Modal -->
  <div id="stock-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="stock-prod-title">Adjust Stock Level</h3>
        <button id="close-stock-modal-btn" class="close-btn">&times;</button>
      </div>

      <form id="stock-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Movement Type *</label>
            <select id="stock-type" class="form-control" required>
              <option value="IN">➕ Stock IN (Received Shipment)</option>
              <option value="OUT">➖ Stock OUT (Manual Withdrawal / Damage)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Quantity Units *</label>
            <input type="number" id="stock-qty" class="form-control" required min="1" placeholder="e.g. 50">
          </div>
        </div>

        <div class="form-group">
          <label>Reason for Movement *</label>
          <input type="text" id="stock-reason" class="form-control" required placeholder="e.g. Supplier PO #402 received at warehouse">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="document.getElementById('stock-modal').classList.remove('active')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update Stock</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Movement Log Modal -->
  <div id="log-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="log-prod-title">Stock Movement History</h3>
        <button id="close-log-modal-btn" class="close-btn">&times;</button>
      </div>

      <div id="movement-log-list" style="max-height: 300px; overflow-y: auto; padding-right: 0.5rem;">
        <!-- Populated dynamically -->
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('log-modal').classList.remove('active')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
