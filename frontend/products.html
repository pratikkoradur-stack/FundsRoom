<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products & Inventory | FUNDSROOM ERP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div id="app-container" class="app-container">
    <!-- Sidebar rendered dynamically by layout.js -->

    <div class="main-wrapper">
      <header class="top-header">
        <div class="page-title-group">
          <h1>Products & Inventory</h1>
          <p>Track catalog SKUs, unit pricing, warehouse spots & minimum stock alerts</p>
        </div>
        <div class="header-actions">
          <button id="add-product-btn" class="btn btn-primary">
            + Add New Product
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Filter & Search Bar -->
        <div class="filter-bar">
          <div class="search-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="product-search" class="form-control" placeholder="Search product name, SKU, category...">
          </div>

          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; font-weight: 600; color: var(--w-brand); cursor: pointer; background: var(--w-brand-light); padding: 0.45rem 1rem; border-radius: var(--radius-full); border: 1px solid var(--w-neutral);">
              <input type="checkbox" id="low-stock-filter" style="width: 16px; height: 16px; accent-color: var(--w-brand); cursor: pointer;">
              <span>⚠️ Show Only Low Stock</span>
            </label>
          </div>
        </div>

        <!-- Products Table -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Product Name</th>
                  <th>SKU</th>
                  <th>Category</th>
                  <th>Unit Price</th>
                  <th>Current Stock</th>
                  <th>Warehouse Spot</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-tbody">
                <!-- Populated dynamically by products.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Product Modal -->
  <div id="product-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Add New Inventory Product</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <form id="product-form">
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="prod-name" class="form-control" required placeholder="e.g. Hydraulic Pump HP-200">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>SKU / Item Code *</label>
            <input type="text" id="prod-sku" class="form-control" required placeholder="e.g. PUMP-10928">
          </div>
          <div class="form-group">
            <label>Category</label>
            <input type="text" id="prod-category" class="form-control" placeholder="e.g. Machinery / Hardware">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Unit Price (₹) *</label>
            <input type="number" step="0.01" id="prod-price" class="form-control" required placeholder="15000">
          </div>
          <div class="form-group">
            <label>Initial Stock *</label>
            <input type="number" id="prod-stock" class="form-control" required placeholder="50">
          </div>
          <div class="form-group">
            <label>Min. Alert *</label>
            <input type="number" id="prod-min-alert" class="form-control" required value="10">
          </div>
        </div>

        <div class="form-group">
          <label>Warehouse Rack Location</label>
          <input type="text" id="prod-location" class="form-control" placeholder="e.g. Rack A-1">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
