<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer CRM | FUNDSROOM ERP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div id="app-container" class="app-container">
    <!-- Sidebar rendered dynamically by layout.js -->

    <div class="main-wrapper">
      <header class="top-header">
        <div class="page-title-group">
          <h1>Customers (CRM)</h1>
          <p>Manage customer leads, wholesale clients, distributors & follow-up notes</p>
        </div>
        <div class="header-actions">
          <button id="add-customer-btn" class="btn btn-primary">
            + Add New Customer
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Filter & Search Bar -->
        <div class="filter-bar">
          <div class="search-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="customer-search" class="form-control" placeholder="Search customer name, business, mobile...">
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <select id="status-filter" class="form-control" style="width: auto;">
              <option value="">All Statuses</option>
              <option value="Lead">Lead</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <!-- Customers Table -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Business / Contact Name</th>
                  <th>Mobile</th>
                  <th>Email</th>
                  <th>Type</th>
                  <th>Status</th>
                  <th>Follow-up Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customers-tbody">
                <!-- Populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Customer Modal -->
  <div id="customer-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Create New Customer</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <form id="customer-form">
        <div class="form-group">
          <label>Contact Person Name *</label>
          <input type="text" id="cust-name" class="form-control" required placeholder="e.g. Rahul Sharma">
        </div>

        <div class="form-group">
          <label>Business Name *</label>
          <input type="text" id="cust-business" class="form-control" required placeholder="e.g. Apex Wholesale Trading Co">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Mobile Number *</label>
            <input type="text" id="cust-mobile" class="form-control" required placeholder="+91 9876543210">
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="cust-email" class="form-control" placeholder="client@domain.com">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Customer Type</label>
            <select id="cust-type" class="form-control">
              <option value="Wholesale">Wholesale</option>
              <option value="Distributor">Distributor</option>
              <option value="Retailer">Retailer</option>
            </select>
          </div>
          <div class="form-group">
            <label>Initial Status</label>
            <select id="cust-status" class="form-control">
              <option value="Active">Active</option>
              <option value="Lead">Lead</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Follow-up Notes / Instructions</label>
          <textarea id="cust-notes" class="form-control" rows="3" placeholder="Enter client preferences or order notes..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
