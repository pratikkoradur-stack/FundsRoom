<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Challans | FUNDSROOM ERP</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div id="app-container" class="app-container">
    <!-- Sidebar rendered dynamically by layout.js -->

    <div class="main-wrapper">
      <header class="top-header">
        <div class="page-title-group">
          <h1>Sales Challans</h1>
          <p>Create delivery challans, deduct inventory stock & print official GST invoices</p>
        </div>
        <div class="header-actions">
          <button id="add-challan-btn" class="btn btn-primary">
            + Create Sales Challan
          </button>
        </div>
      </header>

      <main class="content-area">
        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="search-box">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="challan-search" class="form-control" placeholder="Search challan number, customer name...">
          </div>

          <div style="display: flex; gap: 0.75rem;">
            <select id="challan-status-filter" class="form-control" style="width: auto;">
              <option value="">All Statuses</option>
              <option value="Draft">Draft</option>
              <option value="Confirmed">Confirmed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <!-- Challans Table -->
        <div class="table-card">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Challan #</th>
                  <th>Customer Name</th>
                  <th>Total Items Qty</th>
                  <th>Status</th>
                  <th>Created Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="challans-tbody">
                <!-- Populated dynamically by challans.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Challan Modal -->
  <div id="challan-modal" class="modal-overlay">
    <div class="modal-card" style="max-width: 680px;">
      <div class="modal-header">
        <h3>Create New Sales Challan</h3>
        <button id="close-modal-btn" class="close-btn">&times;</button>
      </div>

      <form id="challan-form">
        <div class="form-group">
          <label>Select Customer *</label>
          <select id="challan-cust-id" class="form-control" required>
            <option value="">-- Choose Wholesale Client --</option>
          </select>
        </div>

        <div style="margin-top: 1.5rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center;">
          <h4 style="font-size: 0.95rem; font-weight: 700; color: var(--text-primary);">Challan Product Line Items</h4>
          <button type="button" id="add-item-row-btn" class="btn btn-secondary btn-sm">+ Add Item</button>
        </div>

        <!-- Dynamic Items Rows Container -->
        <div id="challan-items-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <!-- Item rows inserted dynamically -->
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 2rem;">
          <button type="button" id="cancel-modal-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Generate Challan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/challans.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
