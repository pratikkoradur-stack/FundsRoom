<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Fundsroom Mini ERP + CRM Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <div class="sidebar-brand-icon">E</div>
        <span>Fundsroom ERP</span>
      </div>
      <p class="login-subtitle">Wholesale & Operations Portal</p>
    </div>

    <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); color: var(--danger); padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="admin@company.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" value="admin123">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        Sign In to Portal
      </button>
    </form>

    <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; text-align: center;">
      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; font-weight: 600; text-transform: uppercase;">⚡ Quick One-Click Test Login</p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
        <button type="button" class="btn btn-secondary btn-sm test-login-btn" data-email="admin@company.com">👑 Admin</button>
        <button type="button" class="btn btn-secondary btn-sm test-login-btn" data-email="sales@company.com">💼 Sales</button>
        <button type="button" class="btn btn-secondary btn-sm test-login-btn" data-email="warehouse@company.com">📦 Warehouse</button>
        <button type="button" class="btn btn-secondary btn-sm test-login-btn" data-email="accounts@company.com">📊 Accounts</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
